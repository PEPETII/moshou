<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>墨守成规 宣传图</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#f4efe4}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#f4efe4;font-family:"Ma Shan Zheng","ZCOOL XiaoWei","Microsoft YaHei",serif}
  svg{position:absolute;inset:0}
  .glyph{font-family:"Ma Shan Zheng","ZCOOL XiaoWei",serif;text-anchor:middle;dominant-baseline:central}
  #title{position:absolute;left:150px;top:300px;width:760px;color:#1c1a17;filter:url(#inkbleed)}
  #title .big{font-size:520px;line-height:.8;position:absolute;left:0;top:-20px}
  #title .sub{position:absolute;left:470px;font-size:150px;line-height:1.02;letter-spacing:0;font-weight:400}
</style></head><body>
<div id="stage">
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .09 0"/>
    </filter>
    <filter id="wash" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="4" seed="9" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="46" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="5"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="inkbleed" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="2" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="mt1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f897c" stop-opacity=".55"/><stop offset="1" stop-color="#cfc8b6" stop-opacity="0"/></linearGradient>
    <linearGradient id="mt2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a6459" stop-opacity=".5"/><stop offset="1" stop-color="#cfc8b6" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#d9d0ba" stop-opacity="0"/><stop offset="1" stop-color="#bdb298" stop-opacity=".55"/></radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse"><path d="M72 0H0V72" fill="none" stroke="#cbc2ad" stroke-width="1.4" opacity=".55"/></pattern>
  </defs>

  <rect width="1920" height="1080" fill="#f4efe4"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity=".55"/>
  <rect width="1920" height="1080" filter="url(#paper)"/>

  <!-- 远山：淡墨层叠 -->
  <g filter="url(#wash)">
    <path d="M-60 760 C 150 560 300 520 470 640 C 600 450 780 420 960 640 C 1100 520 1280 500 1450 650 C 1600 560 1760 560 1980 700 L1980 1100 L-60 1100Z" fill="url(#mt1)"/>
    <path d="M-60 880 C 200 700 380 700 560 820 C 760 640 960 660 1150 820 C 1340 700 1560 720 1980 860 L1980 1100 L-60 1100Z" fill="url(#mt2)" opacity=".8"/>
  </g>
  <ellipse cx="1050" cy="330" rx="520" ry="150" fill="url(#glow)" filter="url(#soft)" opacity=".8"/>

  <!-- 路径：石板路，沿用游戏路径色 -->
  <g filter="url(#rough)">
    <path d="M1020 -30 L1020 220 Q1020 250 1050 250 L1480 250 Q1510 250 1510 280 L1510 560 Q1510 590 1480 590 L1260 590 Q1230 590 1230 620 L1230 840 Q1230 870 1260 870 L1690 870 L1990 870" fill="none" stroke="#6a6459" stroke-width="112" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/>
    <path d="M1020 -30 L1020 220 Q1020 250 1050 250 L1480 250 Q1510 250 1510 280 L1510 560 Q1510 590 1480 590 L1260 590 Q1230 590 1230 620 L1230 840 Q1230 870 1260 870 L1690 870 L1990 870" fill="none" stroke="#8a8377" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 朱砂核心 -->
  <g transform="translate(1760 870)">
    <ellipse cx="0" cy="42" rx="70" ry="16" fill="#1c1a17" opacity=".25" filter="url(#blur3)"/>
    <path d="M-52 -4 L0 -32 L52 -4 L52 40 L0 68 L-52 40Z" fill="#c45c48"/>
    <path d="M-52 -4 L0 24 L52 -4 L0 -32Z" fill="#d7715c"/>
    <path d="M0 24 L0 68 L-52 40 L-52 -4Z" fill="#8b3a2f"/>
    <path d="M0 -26 l7 15 16 2 -12 11 3 16 -14 -8 -14 8 3 -16 -12 -11 16 -2z" fill="#f4efe4" transform="translate(0 6) scale(.9)"/>
  </g>

  <!-- 弹道与墨痕 -->
  <g fill="none" stroke-linecap="round" filter="url(#blur3)">
    <path d="M1090 300 Q1180 262 1255 246" stroke="#ff8a3d" stroke-width="7" opacity=".7"/>
    <path d="M1330 420 Q1390 330 1450 262" stroke="#b388ff" stroke-width="7" opacity=".7"/>
    <path d="M1380 700 Q1300 650 1250 600" stroke="#29b6f6" stroke-width="7" opacity=".65"/>
    <path d="M1000 760 Q1100 700 1190 640" stroke="#ffc107" stroke-width="7" opacity=".6"/>
  </g>

  <!-- 敌群：浓墨拖影 -->
  <g class="glyph" fill="#1c1a17">
    <g filter="url(#blur3)" opacity=".28"><text x="1370" y="252" font-size="56">鬼</text><text x="1300" y="252" font-size="56">鬼</text><text x="1512" y="470" font-size="56">尸</text></g>
    <text x="1420" y="250" font-size="64" filter="url(#rough)">鬼</text>
    <text x="1512" y="372" font-size="70" filter="url(#rough)">巨</text>
    <text x="1512" y="470" font-size="60" filter="url(#rough)">尸</text>
    <text x="1380" y="590" font-size="60" filter="url(#rough)">影</text>
    <text x="1230" y="742" font-size="64" filter="url(#rough)">甲</text>
    <text x="1030" y="118" font-size="60" filter="url(#rough)">影</text>
  </g>

  <!-- 炮塔：墨晕圆盘 + 字，色彩取自游戏配置 -->
  <g class="glyph">
    <g transform="translate(1090 330)"><circle r="52" fill="#ff6d00" opacity=".2"/><circle r="52" fill="none" stroke="#ff6d00" stroke-opacity=".25" stroke-width="2"/><text font-size="68" fill="#ff6d00" filter="url(#rough)">火</text></g>
    <g transform="translate(1336 430)"><circle r="52" fill="#b388ff" opacity=".22"/><text font-size="68" fill="#b388ff" filter="url(#rough)">雷</text></g>
    <g transform="translate(1390 710)"><circle r="52" fill="#29b6f6" opacity=".2"/><text font-size="68" fill="#039be5" filter="url(#rough)">水</text></g>
    <g transform="translate(1000 770)"><circle r="52" fill="#ffc107" opacity=".25"/><text font-size="68" fill="#ffb300" filter="url(#rough)">金</text></g>
    <g transform="translate(1655 640)"><circle r="52" fill="#81c784" opacity=".25"/><text font-size="68" fill="#66a06a" filter="url(#rough)">木</text></g>
    <g transform="translate(1660 420)"><circle r="52" fill="#80d8ff" opacity=".3"/><text font-size="68" fill="#4fb8e0" filter="url(#rough)">冰</text></g>
    <g transform="translate(1120 560)"><circle r="52" fill="#b0bec5" opacity=".3"/><text font-size="68" fill="#78909c" filter="url(#rough)">风</text></g>
  </g>

  <!-- 墨点飞溅 -->
  <g fill="#1c1a17" filter="url(#rough)" opacity=".75">
    <circle cx="930" cy="330" r="9"/><circle cx="962" cy="372" r="5"/><circle cx="905" cy="392" r="4"/>
    <circle cx="880" cy="760" r="7"/><circle cx="930" cy="790" r="4"/><circle cx="150" cy="890" r="8"/><circle cx="190" cy="925" r="4"/>
  </g>
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>

<div id="title">
  <div class="big">墨</div>
  <div class="sub" style="top:52px">守<br>成<br>规</div>
</div>
</div>
</body></html>
